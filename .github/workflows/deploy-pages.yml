name: Deploy Tegeera demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build static demo
        run: npm run build
        env:
          VITE_TEGEERA_INTERPRETER_URL: ${{ vars.TEGEERA_INTERPRETER_URL }}

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build static demo
        run: npm run build
        env:
          VITE_TEGEERA_INTERPRETER_URL: ${{ vars.TEGEERA_INTERPRETER_URL }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
